    // Custom Audio Effects Synthesizer (Web Audio API)
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'tick') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'win') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'click') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.start();
          osc.stop(ctx.currentTime + 0.03);
        }
      } catch(e) {}
    };

          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />

    const DEFAULT_ACTIVITIES = [
      // Baja Energía (🔴)
      { id: 'a1', title: 'Ponte audífonos y escucha 1 canción lo-fi con los ojos cerrados', category: 'Mente & Calma', energy: 'low', minutes: 3, icon: '🎧' },

      { id: 'a5', title: 'Garabatea libremente en un papel sin ningún objetivo', category: 'Creativo', energy: 'low', minutes: 5, icon: '✏️' },
      
      // Media Energía (🟡)
      { id: 'a6', title: 'Limpia tu escritorio: quita 5 objetos innecesarios de tu vista', category: 'Orden Rápido', energy: 'medium', minutes: 5, icon: '🧹' },

      { id: 'a10', title: 'Envía un mensaje corto de agradecimiento a un amigo o colega', category: 'Social', energy: 'medium', minutes: 2, icon: '💬' },

      // Alta Energía (🟢)
      { id: 'a11', title: 'Sprint de 10 min: Limpia la carpeta de Descargas de tu equipo', category: 'Orden Rápido', energy: 'high', minutes: 10, icon: '💻' },

      { id: 'a13', title: 'Escribe 3 ideas sueltas o mapa mental rápido para un proyecto', category: 'Creativo', energy: 'high', minutes: 10, icon: '💡' },
      { id: 'a14', title: 'Haz 20 Jumping Jacks y bébete un vaso de agua helada', category: 'Cuerpo', energy: 'high', minutes: 5, icon: '⚡' },
      { id: 'a15', title: 'Organiza un cajón completo o la encimera de tu espacio', category: 'Orden Rápido', energy: 'high', minutes: 15, icon: '📦' }
    ];

    const CRISIS_ACTIONS = [
      { id: 'c1', title: 'Ponte de pie inmediatamente, estira los brazos al techo e inhala profundo 3 veces. ¡Cero pensar!', icon: '🙌' },
      { id: 'c2', title: 'Ve al lavabo, lávate las manos con agua helada durante 30 segundos y sacúdelas fuerte.', icon: '🌊' },
      { id: 'c3', title: 'Abre la ventana, mira al horizonte y nombra en voz alta 3 cosas de color azul.', icon: '👀' },
      { id: 'c4', title: 'Bébete un vaso entero de agua fría de un solo trago sin parar.', icon: '🥤' },
      { id: 'c5', title: 'Agarra 3 papeles viejos de tu mesa, arrúgalos con fuerza y tíralos a la papelera.', icon: '🗑️' }
    ];

    function App() {
      // Inputs del usuario
      const [energy, setEnergy] = useState('medium'); // 'low', 'medium', 'high'
      const [maxMinutes, setMaxMinutes] = useState(5);
      
      // Estados de la App
      const [isSpinning, setIsSpinning] = useState(false);
      const [currentSelection, setCurrentSelection] = useState(null);
      const [activeTab, setActiveTab] = useState('decide'); // 'decide', 'menu', 'crisis', 'stats'
      
      // Temporizador
      const [activeTimerTask, setActiveTimerTask] = useState(null);
      const [timeLeft, setTimeLeft] = useState(0);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // Persistencia
      const [confirmedMenu, setConfirmedMenu] = useState(() => {
        try {
          const saved = localStorage.getItem('dopamine_app_menu_v2');
          return saved ? JSON.parse(saved) : [DEFAULT_ACTIVITIES[0], DEFAULT_ACTIVITIES[6]];
        } catch(e) {
          return [DEFAULT_ACTIVITIES[0]];
        }
      });

      const [stats, setStats] = useState(() => {
        try {
          const saved = localStorage.getItem('dopamine_app_stats_v2');
          return saved ? JSON.parse(saved) : { points: 40, crisisSolved: 0, totalDecisions: 0, streak: 3 };
        } catch(e) {
          return { points: 40, crisisSolved: 0, totalDecisions: 0, streak: 3 };
        }
      });

      // Persistencia de Evidencias Fotográficas
      const [evidenceLog, setEvidenceLog] = useState(() => {
        try {
          const saved = localStorage.getItem('dopamine_app_evidence_v2');
          return saved ? JSON.parse(saved) : [];
        } catch(e) {
          return [];
        }
      });

      // Estado para la subida de evidencia de una tarea completada
      const [pendingEvidenceTask, setPendingEvidenceTask] = useState(null);
      const [selectedImage, setSelectedImage] = useState(null);

      // Modales & Toasts
      const [showAddCustomModal, setShowAddCustomModal] = useState(false);
      const [newTitle, setNewTitle] = useState('');
      const [newCategory, setNewCategory] = useState('Mente & Calma');
      const [newEnergy, setNewEnergy] = useState('low');
      const [newMinutes, setNewMinutes] = useState(5);
      const [toast, setToast] = useState(null);

      // Save LocalStorage
      useEffect(() => {
        try { localStorage.setItem('dopamine_app_menu_v2', JSON.stringify(confirmedMenu)); } catch(e){}
      }, [confirmedMenu]);

      useEffect(() => {
        try { localStorage.setItem('dopamine_app_stats_v2', JSON.stringify(stats)); } catch(e){}
      }, [stats]);

      useEffect(() => {
        try { localStorage.setItem('dopamine_app_evidence_v2', JSON.stringify(evidenceLog)); } catch(e){}
      }, [evidenceLog]);

      // Timer interval
      useEffect(() => {
        let timer = null;
        if (isTimerRunning && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => prev - 1);
          }, 1000);
        } else if (timeLeft === 0 && isTimerRunning) {
          setIsTimerRunning(false);
          playSound('win');
          showToast("🎉 ¡Micro-acción completada! Sube tu evidencia.");
          setPendingEvidenceTask(activeTimerTask);
          setActiveTimerTask(null);
        }
        return () => clearInterval(timer);
      }, [isTimerRunning, timeLeft, activeTimerTask]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const addPoints = (pts) => {
        setStats(prev => ({ ...prev, points: prev.points + pts }));
      };

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 4 * 1024 * 1024) {
            showToast("⚠️ La foto excede 4MB. Elige una imagen más liviana.");
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            setSelectedImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const completeTaskWithEvidence = (customPoints = 15) => {
        if (!pendingEvidenceTask) return;
        const pts = selectedImage ? customPoints + 10 : customPoints; // +10 bonus pts for uploading photo
        const newLog = {
          id: 'log_' + Date.now(),
          title: pendingEvidenceTask.title,
          icon: pendingEvidenceTask.icon || '⚡',
          date: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
          photo: selectedImage,
          points: pts
        };
        setEvidenceLog(prev => [newLog, ...prev]);
        addPoints(pts);
        playSound('win');
        showToast(selectedImage ? `📸 ¡Evidencia guardada! +${pts} Pts (+10 bonus foto)` : `🎉 ¡Logro guardado! +${pts} Pts`);
        setPendingEvidenceTask(null);
        setSelectedImage(null);
      };

      const deleteEvidence = (id) => {
        playSound('click');
        setEvidenceLog(prev => prev.filter(item => item.id !== id));
        showToast("Evidencia eliminada.");
      };

      // Tragamonedas de Decisión Instantánea
      const spinMachine = () => {
        playSound('click');
        setIsSpinning(true);
        setCurrentSelection(null);

        const availablePool = [...DEFAULT_ACTIVITIES, ...confirmedMenu.filter(c => !DEFAULT_ACTIVITIES.some(d => d.id === c.id))];
        let candidates = availablePool.filter(act => act.energy === energy && act.minutes <= maxMinutes);

        if (candidates.length === 0) candidates = availablePool.filter(act => act.minutes <= maxMinutes);
        if (candidates.length === 0) candidates = availablePool;

        let counter = 0;
        const interval = setInterval(() => {
          playSound('tick');
          const rand = Math.floor(Math.random() * candidates.length);
          setCurrentSelection(candidates[rand]);
          counter++;
          if (counter > 10) {
            clearInterval(interval);
            setIsSpinning(false);
            playSound('win');
            setStats(prev => ({ ...prev, totalDecisions: prev.totalDecisions + 1 }));
          }
        }, 90);
      };

      const toggleSaveToMenu = (activity) => {
        playSound('click');
        const exists = confirmedMenu.some(i => i.id === activity.id);
        if (exists) {
          setConfirmedMenu(prev => prev.filter(i => i.id !== activity.id));
          showToast("Removido de tu Menú Confirmado");
        } else {
          setConfirmedMenu(prev => [activity, ...prev]);
          addPoints(10);
          showToast("⭐ Guardado en tu Menú Confirmado (+10 Pts)");
        }
      };

      const startTimer = (activity) => {
        playSound('click');
        setActiveTimerTask(activity);
        setTimeLeft(activity.minutes * 60);
        setIsTimerRunning(true);
      };

      const handleAddCustom = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const customItem = {
          id: 'custom_' + Date.now(),
          title: newTitle.trim(),
          category: newCategory,
          energy: newEnergy,
          minutes: parseInt(newMinutes, 10),
          icon: '⭐'
        };
        setConfirmedMenu(prev => [customItem, ...prev]);
        setShowAddCustomModal(false);
        setNewTitle('');
        addPoints(15);
        showToast("✨ Actividad personalizada guardada.");
      };

      const copyMenuToClipboard = () => {
        playSound('click');
        const text = "🧠 MI MENÚ DE DOPAMINA 🧠\n\n" +
          confirmedMenu.map((act, i) => `${i + 1}. ${act.icon} ${act.title} (${act.minutes} min)`).join('\n') +
          "\n\nGenerado en ¿Qué Hago Ahora? App";
        
        try {
          const area = document.createElement('textarea');
          area.value = text;
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          document.body.removeChild(area);
          showToast("📋 ¡Menú copiado en formato texto!");
        } catch(err) {
          showToast("No se pudo copiar automáticamente.");
        }
      };

      return (
        <div className="flex flex-col h-screen max-w-md mx-auto bg-slate-950 text-slate-100 shadow-2xl relative border-x border-slate-800/60 overflow-hidden font-sans">

            {activeTab === 'stats' && (
              <div className="space-y-4 animate-card-pop">
                
                <h2 className="text-base font-bold text-white">Tu Progreso de Inercia</h2>

                <div className="grid grid-cols-3 gap-2">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3 text-center">
                    <span className="text-xl block mb-1">⚡</span>
                    <span className="text-lg font-black text-white">{stats.points}</span>
                    <span className="text-[10px] text-slate-400 block">Puntos</span>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3 text-center">
                    <span className="text-xl block mb-1">🚨</span>
                    <span className="text-lg font-black text-white">{stats.crisisSolved}</span>
                    <span className="text-[10px] text-slate-400 block">Crisis Rotas</span>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3 text-center">
                    <span className="text-xl block mb-1">🎲</span>
                    <span className="text-lg font-black text-white">{stats.totalDecisions}</span>
                    <span className="text-[10px] text-slate-400 block">Decisiones</span>
                  </div>
                </div>

                {/* Level Gauge */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-bold text-indigo-300">
                      Nivel: {stats.points >= 100 ? '🥇 Master Dopamínico' : stats.points >= 50 ? '🥈 Rompedor de Inercia' : '🥉 Novato de Acción'}
                    </span>
                    <span className="font-mono text-slate-400 font-bold">{stats.points}/100</span>
                  </div>
                  <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                    <div
                      className="bg-gradient-to-r from-indigo-500 to-emerald-400 h-full transition-all duration-500 rounded-full"
                      style={{ width: `${Math.min(100, (stats.points / 100) * 100)}%` }}
                    ></div>
                  </div>
                </div>

                {/* MURO DE EVIDENCIAS FOTOGRÁFICAS */}
                <div className="space-y-3 pt-2">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                      <Icons.Camera /> Muro de Evidencias ({evidenceLog.length})
                    </h3>
                  </div>

                  {evidenceLog.length === 0 ? (
                    <div className="text-center py-6 bg-slate-900/60 rounded-2xl border border-slate-800/80 text-slate-500 text-xs space-y-1">
                      <span className="text-2xl block">📷</span>
                      <p className="font-medium text-slate-300">Aún no has subido fotografías de evidencia.</p>
                      <p className="text-[10px] text-slate-500">Completa actividades para armar tu galería visual de logros.</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-2.5">
                      {evidenceLog.map((log) => (
                        <div key={log.id} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col justify-between shadow-md">
                          {log.photo ? (
                            <div className="h-28 bg-black relative">
                              <img src={log.photo} alt={log.title} className="w-full h-full object-cover" />
                              <span className="absolute top-1.5 right-1.5 bg-slate-900/80 text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded-full backdrop-blur-md">
                                +{log.points} pts
                              </span>
                            </div>
                          ) : (
                            <div className="h-20 bg-slate-800/50 flex items-center justify-center text-3xl relative">
                              <span>{log.icon}</span>
                              <span className="absolute top-1.5 right-1.5 bg-slate-900/80 text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded-full">
                                +{log.points} pts
                              </span>
                            </div>
                          )}
                          <div className="p-2.5 space-y-1">
                            <p className="text-xs font-bold text-white line-clamp-2 leading-tight">{log.title}</p>
                            <div className="flex justify-between items-center text-[10px] text-slate-400 pt-1 border-t border-slate-800/60">
                              <span>{log.date}</span>
                              <button 
                                onClick={() => deleteEvidence(log.id)}
                                className="text-slate-500 hover:text-rose-400 p-0.5 transition-colors"
                              >
                                <Icons.Trash />
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}

          </main>

          {}
          {/* BOTTOM FIXED APP NAVIGATION BAR */}
          <nav className="absolute bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-xl border-t border-slate-800/80 px-2 py-2 flex items-center justify-around z-20">
            
            <button
              onClick={() => { playSound('click'); setActiveTab('decide'); }}
              className={`flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl transition-all ${
                activeTab === 'decide' ? 'text-indigo-400 font-bold bg-indigo-500/10' : 'text-slate-500 hover:text-slate-300'
              }`}
            >
              <Icons.Slot />
              <span className="text-[10px] mt-1">Decidir</span>
            </button>

            <button
              onClick={() => { playSound('click'); setActiveTab('menu'); }}
              className={`flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl transition-all relative ${
                activeTab === 'menu' ? 'text-indigo-400 font-bold bg-indigo-500/10' : 'text-slate-500 hover:text-slate-300'
              }`}
            >
              <Icons.Menu />
              <span className="text-[10px] mt-1">Mi Menú</span>
              {confirmedMenu.length > 0 && (
                <span className="absolute top-1 right-2 w-2 h-2 bg-indigo-500 rounded-full"></span>
              )}
            </button>

            <button
              onClick={() => { playSound('click'); setActiveTab('crisis'); }}
              className={`flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl transition-all ${
                activeTab === 'crisis' ? 'text-rose-400 font-bold bg-rose-500/20' : 'text-rose-500/80 hover:text-rose-400'
              }`}
            >
              <Icons.Siren />
              <span className="text-[10px] mt-1">S.O.S</span>
            </button>

            <button
              onClick={() => { playSound('click'); setActiveTab('stats'); }}
              className={`flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl transition-all ${
                activeTab === 'stats' ? 'text-indigo-400 font-bold bg-indigo-500/10' : 'text-slate-500 hover:text-slate-300'
              }`}
            >
              <Icons.Stats />
              <span className="text-[10px] mt-1">Progreso</span>
            </button>

          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
